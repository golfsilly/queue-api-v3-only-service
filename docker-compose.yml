name: aran-queue

services:
  queue-api:
    build: .
    image: aran-queue:latest
    command: ["node", "dist/main.api.js"]
    env_file: .env
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-5600}:5600"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5600/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ตัวแยกเส้นทางที่พอร์ต 5504 (URL เดิม) เปิดใช้ในขั้นที่ 3 ของคู่มือเท่านั้น: docker compose --profile proxy up -d
  # เส้นทางที่ใช้ = deploy/nginx/default.conf (เริ่มต้น = ส่งทุกอย่างไปตัวเดิม)
  queue-proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
